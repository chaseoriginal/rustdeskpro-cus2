services:
  hbbs:
    container_name: hbbspro1
    image: docker.io/rustdesk/rustdesk-server-pro:latest
    command: hbbs
    volumes:
    - /var/lib/docker/volumes/hbbspro1/data:/root
    network_mode: host
    depends_on:
    - hbbr
    restart: unless-stopped
  hbbr:
    container_name: hbbrpro1
    image: docker.io/rustdesk/rustdesk-server-pro:latest
    command: hbbr
    volumes:
    - /var/lib/docker/volumes/hbbrpro1:/root
    network_mode: host
    restart: unless-stopped
volumes: {}
